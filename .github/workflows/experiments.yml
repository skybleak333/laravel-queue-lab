name: experiments

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, to notice when a new Laravel or package release changes a result.
    - cron: '0 6 * * 1'

jobs:
  ack-timeout:
    name: RabbitMQ ack timeout (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pcntl, sockets
          coverage: none

      - name: Start RabbitMQ
        run: docker compose up -d --wait

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Show versions
        run: composer show | grep -E '^(laravel/framework|orchestra/testbench|php-amqplib/php-amqplib|phpunit/phpunit|vladimir-yuldashev/laravel-queue-rabbitmq) '

      - name: Run the experiments
        run: vendor/bin/phpunit

      - name: Broker log
        if: always()
        run: docker compose logs rabbitmq | tail -n 100
